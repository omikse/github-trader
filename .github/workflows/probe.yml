name: Probe data sources
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe_sources.py
      - name: Save to probe branch
        run: |
          git config user.name trading-bot; git config user.email trading-bot@users.noreply.github.com
          blob=$(git hash-object -w probe.json); tree=$(printf "100644 blob %s\tprobe.json\n" "$blob" | git mktree)
          c=$(git commit-tree "$tree" -m probe); git push -f origin "$c:refs/heads/probe"
